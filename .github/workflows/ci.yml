name: ci.yml

on: [push, workflow_dispatch] # workflow_dispatch is github manual trigger

jobs:
  ci:
    environment: dev # this and other github environments are configured in Settings > Environments
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7

    - name: setup env
      run: |
        sudo apt-get update

        sudo apt-get install -y openjdk-18-jdk-headless
        sudo update-alternatives --set java /usr/lib/jvm/java-18-openjdk-amd64

        update-alternatives --display java
        echo "$ java -version"
        java -version
        echo "$ javac -version"
        javac -version

        sudo apt-get install -y maven
        echo "$ mvn -v"
        mvn -v

    - name: build
      run: |
        mvn compile test-compile
    
    - name: test
      run: |
        mvn test
