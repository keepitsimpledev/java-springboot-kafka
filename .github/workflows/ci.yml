name: ci.yml

on: [push, workflow_dispatch] # workflow_dispatch is github manual trigger

jobs:
  ci:
    environment: dev # this and other github environments are configured in Settings > Environments
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: build
      run: |
        mvn -v
        mvn compile test-compile
    
    - name: test
      run: |
        mvn test
    
    - name: dock
      run: |
        docker -v
        sudo docker pull eclipse-temurin:17-jdk
        mvn package
        sudo docker build --tag=exploration:latest .
        sudo docker run --name dkcon -d -p8887:8888 exploration:latest
        sudo docker container ls -a
        ss -ltn # checks port listeners
        sudo docker run -dit --name basic ubuntu:22.04
        sleep 10
        sudo docker inspect dkcon | grep IPAddress
        sudo docker inspect basic | grep IPAddress
        echo "host: curl localhost:8887"
        curl localhost:8887
        sleep 1
        sudo docker exec -i basic sh -c "apt-get update"
        sudo docker exec -i basic sh -c "apt-get install -y curl"
        echo "basic: curl 172.17.0.2:8888"
        sudo docker exec -i basic sh -c "curl 172.17.0.2:8888"
        sudo docker stop dkcon
        sudo docker stop basic
        sudo docker rm dkcon
        sudo docker rm basic
