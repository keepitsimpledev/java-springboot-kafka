name: ci.yml

on: [push, workflow_dispatch] # workflow_dispatch is github manual trigger

jobs:
  ci:
    environment: dev # this and other github environments are configured in Settings > Environments
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v2

    - name: install java
      run: |
        sudo apt update # as always
        sudo apt install openjdk-18-jdk-headless
        java -version # confirmation
        javac -version # confirmation
