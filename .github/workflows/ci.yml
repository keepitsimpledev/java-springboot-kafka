name: ci.yml

on: [push, workflow_dispatch] # workflow_dispatch is github manual trigger

jobs:
  ci:
    environment: dev # this and other github environments are configured in Settings > Environments
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7

    - name: setup env
      run: |
        export NAME=dev
        echo $NAME
        # sudo apt-get update

        # sudo apt-get install -y openjdk-17-jdk-headless
        # sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
        # sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

        # # need to update JAVA_HOME to be recognized by maven
        # export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        # echo '$ echo $JAVA_HOME'
        # echo $JAVA_HOME
        # echo export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64 >> ~/.bashrc

        # export PATH=$PATH:$JAVA_HOME/bin
        # echo export PATH=$PATH:$JAVA_HOME/bin >> ~/.bashrc

        # update-alternatives --display java
        # echo "$ java -version"
        # java -version
        # echo "$ javac -version"
        # javac -version

        # install maven directly instead of using apt-get because apt-get is outdated
        echo "$ mvn -v"
        mvn -v
        mkdir maven
        pushd maven
        wget https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
        tar -xvf apache-maven-3.9.16-bin.tar.gz
        export PATH=apache-maven-3.8.6/bin:$PATH
        echo "$ mvn -v"
        mvn -v
        popd

    - name: build
      run: |
        echo $NAME
        mvn -v
        # mvn compile test-compile
    
