name: ci.yml

on: [push, workflow_dispatch] # workflow_dispatch is github manual trigger

jobs:
  ci:
    environment: dev # this and other github environments are configured in Settings > Environments
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: build
      run: |
        mvn -v
        mvn compile test-compile
    
    - name: test
      run: |
        mvn test
    
    - name: docker
      run: |
        docker -v

        # launch containers

        sudo docker pull apache/kafka:4.3.1
        sudo docker run -dit --name kafka1 -p 9092:9092 apache/kafka:4.3.1

        sudo docker pull eclipse-temurin:17-jdk
        mvn package -Dmaven.test.skip
        sudo docker build -f app.Dockerfile --tag=exploration:latest .
        sudo docker run -d --name dkcon -p8887:8888 exploration:latest

        sudo docker build -f basic.Dockerfile --tag=basic:latest .
        sudo docker run -dit --name basic basic:latest

        # check containers

        sudo docker container ls -a # equivalent to legacy `sudo docker ps -a`

        echo "k1"
        CURL_DKCON=$(curl --silent --fail localhost:8887)
        echo "k2"
        CURL_DKCON_LENGTH=${#CURL_DKCON}
        if [ $CURL_DKCON_LENGTH -gt 0 ]; then
          echo "k3"
          CURL_DKCON_SUCCESS=true
          echo "container dkcon successfully initalized"
          localhost:8887
        else
          echo "k4"
          CURL_DKCON_SUCCESS=false
          echo "container dkcon not yet initalized"
        fi
        echo "k5"
        if [ $CURL_DKCON_SUCCESS = false ]; then
          echo "waiting up to 60 seconds for container dkcon to initalize"
          for i in {1..20}; do
            echo "wait 3 seconds"
            sleep 3
            echo "waited a total of $((i*3)) seconds - checking"
            CURL_DKCON=$(curl --silent --fail localhost:8887)
            CURL_DKCON_LENGTH=${#CURL_DKCON}
            if [ $CURL_DKCON_LENGTH -gt 0 ]; then
              CURL_DKCON_SUCCESS=true
              echo "container dkcon successfully initalized"
              curl localhost:8887
              break
            elif [ $i -eq 20 ]; then
              echo "container dkcon failed to initalize"
              curl localhost:8887
            fi
          done
        fi

        echo "container dkcon IP address (should be 172.17.0.3):"
        sudo docker inspect dkcon | grep IPAddress

        echo "container.kafka1 IP address (should be 172.17.0.2):"
        sudo docker inspect kafka1 | grep IPAddress # dkcon successful init indicates kafka1 successful init

        echo "container.basic$ curl 172.17.0.3:8888"
        sudo docker exec -i basic sh -c "curl 172.17.0.3:8888"

        # unnecessary
        # sudo docker stop dkcon
        # sudo docker stop basic
        # sudo docker rm dkcon
        # sudo docker rm basic
